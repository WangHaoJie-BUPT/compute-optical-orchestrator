global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - /etc/prometheus/compute-optical.rules.yml

scrape_configs:
  - job_name: prometheus

    static_configs:
      - targets:
          - localhost:9090

  - job_name: compute-optical-orchestrator

    metrics_path: /metrics/
    scheme: http

    static_configs:
      - targets:
          - compute-optical-orchestrator-metrics.orchestrator-system.svc.cluster.local:9100

        labels:
          environment: kind-cluster
          component: orchestrator-api
