apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: observability

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.0
          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --web.enable-lifecycle

          ports:
            - name: http
              containerPort: 9090

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http

            initialDelaySeconds: 15
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true

            - name: config
              mountPath: /etc/prometheus/compute-optical.rules.yml
              subPath: compute-optical.rules.yml
              readOnly: true

            - name: data
              mountPath: /prometheus

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service

metadata:
  name: prometheus
  namespace: observability

spec:
  selector:
    app: prometheus

  ports:
    - name: http
      port: 9090
      targetPort: http
