apiVersion: batch/v1
kind: Job

metadata:
  name: site-smoke-test
  namespace: compute-optical

spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600

  template:
    metadata:
      labels:
        app: site-smoke-test
        orchestrator-task-id: smoke-task-001

    spec:
      restartPolicy: Never

      nodeSelector:
        compute-site: site-rennes

      containers:
        - name: worker
          image: busybox:1.36
          imagePullPolicy: Never

          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          command:
            - sh
            - -c
            - |
              set -eu

              echo "Task started"
              echo "Pod name: ${POD_NAME}"
              echo "Selected Kubernetes node: ${NODE_NAME}"
              echo "Expected compute site: site-rennes"

              sleep 3

              echo "Task completed"
