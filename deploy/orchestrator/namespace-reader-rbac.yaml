apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: compute-optical-namespace-reader

rules:
  - apiGroups:
      - ""

    resources:
      - namespaces

    resourceNames:
      - compute-optical

    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: compute-optical-namespace-reader

subjects:
  - kind: ServiceAccount
    name: compute-optical-orchestrator
    namespace: orchestrator-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compute-optical-namespace-reader
